name: RTAFNC Security Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Block secrets and sensitive tracked data
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            lower="$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              .env|*/.env|.clasprc.json|*/.clasprc.json|.clasp.json|*/.clasp.json|*.pem|*.key|*.p12|*.pfx|id_rsa*|*/id_rsa*|*credentials*.json|*service-account*.json|*service_account*.json|*/students.json|*/students_data.js|*/students_photos.js|*/teachers_data.js|*/deeds.json|*/deeds_data.js|*/all_assessments.json|*/missing_students.json|*/line_mappings.json|*/medical_records.json|*/patients.json|*/private-data/*|*/private/*|*/secrets/*|*/backups/*|*/exports/*)
                fail=1 ;;
            esac
          done < <(git ls-files)
          pattern='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|DEFAULT_LINE_CHANNEL_ACCESS_TOKEN[[:space:]]*='
          if git grep -IlE "$pattern" -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.py' '*.gs' '*.json' '*.yml' '*.yaml' '*.toml' '*.ini' '*.conf' '*.sh' '*.html' >/dev/null 2>&1; then
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo '::error::Security Guard blocked sensitive tracked data or a possible hard-coded credential. Details are intentionally not printed.'
            exit 1
          fi
          echo 'Security Guard passed.'
