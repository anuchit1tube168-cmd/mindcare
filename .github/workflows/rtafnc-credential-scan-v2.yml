name: RTAFNC Credential Scan V2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Scan tracked source without exposing findings
        shell: bash
        run: |
          set -euo pipefail
          pattern='(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|DEFAULT_LINE_CHANNEL_ACCESS_TOKEN[[:space:]]*=)'
          if git grep -IlE -e "$pattern" -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.py' '*.gs' '*.json' '*.yml' '*.yaml' '*.toml' '*.ini' '*.conf' '*.sh' '*.html' >/dev/null 2>&1; then
            echo '::error::Possible hard-coded credential detected. File names and secret values are intentionally not printed.'
            exit 1
          fi
          echo 'Credential scan passed.'
