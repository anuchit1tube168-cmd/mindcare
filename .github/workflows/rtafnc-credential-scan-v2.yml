name: RTAFNC Credential Scan V2

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * *'

permissions:
  contents: read

jobs:
  credential-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Scan tracked source without printing secret values
        shell: bash
        run: |
          set -euo pipefail
          pattern='(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-[A-Za-z0-9_-]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|DEFAULT_LINE_CHANNEL_ACCESS_TOKEN[[:space:]]*=)'
          hits="$(git grep -IlE -e "$pattern" -- '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.py' '*.gs' '*.json' '*.yml' '*.yaml' '*.toml' '*.ini' '*.conf' '*.sh' '*.html' 2>/dev/null || true)"
          if [ -n "$hits" ]; then while IFS= read -r f; do [ -z "$f" ] && continue; echo "::error file=$f::Possible hard-coded credential detected; value intentionally hidden"; done <<< "$hits"; exit 1; fi
          echo 'Credential scan passed.'
